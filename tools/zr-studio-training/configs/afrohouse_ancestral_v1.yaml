# VHUNAMBI Phase 85 — Ancestral Afro House LoRA
dataset:
  s3_prefix: "training-data/curated/"
  lora_id: "afrohouse_ancestral_v1"

training:
  lora_name: "afrohouse_ancestral_v1"
  lora_rank: 16
  lora_alpha: 32
  epochs: 10
  batch_size: 2
  grad_accum_steps: 2
  learning_rate: 1.2e-4
  warmup_steps: 40
  precision: "bf16"

output:
  r2_key: "loras/afrohouse_ancestral_v1.safetensors"
