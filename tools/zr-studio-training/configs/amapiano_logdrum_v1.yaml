# VHUNAMBI Phase 85 — Amapiano Log Drum Specialist LoRA
dataset:
  s3_prefix: "training-data/curated/"
  lora_id: "amapiano_logdrum_v1"

training:
  lora_name: "amapiano_logdrum_v1"
  lora_rank: 32
  lora_alpha: 64
  epochs: 12
  batch_size: 2
  grad_accum_steps: 2
  learning_rate: 1.5e-4
  warmup_steps: 50
  precision: "bf16"

output:
  r2_key: "loras/amapiano_logdrum_v1.safetensors"
